<dialog id="modal-container" class="modal">
  <div class="modal-box">
    <h2 class="font-bold text-2xl" id="modal-title">Fix broken image uploads</h2>
    <div class="flex space-x-3">
    <button class="rounded-full btn btn-success text-white" id="modal-status">opened</button>
    
      <p class="text-gray-600" id="modal-assignee">. Opened by Fahim Ahmed</p>
      <p class="text-gray-600" id="modal-createdAt">. 22/02/2026</p>
    
  </div>
  <div class="pl-5 space-x-5 mt-8 " id="modal-labels">
    <button class="btn btn-soft btn-error rounded-full outline " id="modal-bug">BUG</button>
    <button class="btn btn-soft btn-warning rounded-full outline" id="modal-help">HELP WANTED</button>
  </div>

  <p class="text-gray-600 pt-6" id="modal-description">The navigation menu doesn't collapse properly on mobile devices. Need to fix the responsive behavior.</p>
 
  <div class="flex justify-between  bg-sky-50 mt-6">

    </p>
    <p> <span class="text-gray-600" id="modal-priority">Priority:</span><br>
      <button class="btn bg-red-500 text-white rounded-full" id="modal-prio">HIGH</button>
    </p>
  </div>
    <form method="dialog">
      <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
      
    </form>
